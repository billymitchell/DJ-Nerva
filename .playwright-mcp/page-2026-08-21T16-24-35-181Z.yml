  - generic [ref=e29]:
    - heading "About Me" [level=2] [ref=e30]
    - paragraph [ref=e31]: Baltimore native DJ Nerva spins kinetic mosaics of sound, threading high-BPM breaks—jungle, drum-and-bass, footwork—into global club rhythms, heady techno, and classic house. Quick cuts, tempo jumps, and gritty Charm-City vibes. He honors Baltimore Club heritage and champions the local creative community. From intimate art-gallery marathons to sweat-soaked warehouse nights, neighborhood bars, and pop-up parties in unexpected spaces, Nerva is a selector who lives for the dance-floor connection. Expect sweat, smiles, and a vibe that lingers long after the system powers down.
